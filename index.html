<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utsav Acharya - Portfolio</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/2cbbf6159b.js" crossorigin="anonymous"></script>
</head>

<body class="main-content">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span data-bind="username">clerisy47</span>
            </div>
            <ul class="nav-menu">
                <li><a href="#home" class="nav-link active-nav">Home</a></li>
                <li><a href="#about" class="nav-link">About</a></li>
                <li><a href="#portfolio" class="nav-link">Projects</a></li>
                <li><a href="#contact" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero-section" id="home">
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">
                    Hi, I'm <span class="highlight" data-bind="name">Utsav Acharya</span>
                </h1>
                <p class="hero-subtitle" data-bind="role">AI Engineer</p>
                <p class="hero-description" data-bind-html="summary"></p>
                <div class="hero-buttons">
                    <a href="CV.pdf" class="main-btn" data-bind-href="cvFile">
                        <span class="btn-text">Download CV</span>
                        <span class="btn-icon"><i class="fas fa-download"></i></span>
                    </a>
                    <a href="#contact" class="secondary-btn">
                        <span class="btn-text">Get In Touch</span>
                    </a>
                </div>
            </div>
            <div class="hero-image">
                <div class="image-wrapper">
                    <img src="img/pfp.png" alt="Utsav Acharya" data-bind-src="profileImage" data-bind-alt="name">
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="container about" id="about">
            <div class="main-title">
                <h2>About <span>me</span></h2>
            </div>
            <div class="about-container">
                <div class="right-about" data-bind-list="stats"></div>
            </div>
            <div class="about-stats">
                <h4 class="stat-title">My <span>Skills</span></h4>
                <div data-bind-list="skills"></div>
            </div>
            <h4 class="stat-title">Working <span>Experience</span></h4>
            <div class="timeline" data-bind-list="experience"></div>
            <h4 class="stat-title">Educational <span>Experience</span></h4>
            <div class="timeline" data-bind-list="education"></div>
        </section>

        <section class="container" id="portfolio">
            <div class="main-title">
                <h2>My <span>Projects</span></h2>
            </div>
            <p class="port-text" data-bind="portfolioIntro"></p>
            <div class="portfolios" data-bind-list="portfolio"></div>
        </section>

        <section class="container contact" id="contact">
            <div class="contact-container">
                <div class="main-title">
                    <h2>Contact <span>Me</span></h2>
                </div>
                <div class="contact-content-con">
                    <div class="left-contact">
                        <h4>Contact me here</h4>
                        <p data-bind="contactBlurb"></p>
                        <div class="contact-icons">
                            <div class="contact-icon" data-bind-list="social"></div>
                        </div>
                        <div class="contact-info" data-bind-list="contactInfo"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="theme-btn">
        <i class="fas fa-adjust"></i>
    </div>
    <script src="app.js"></script>
</body>

</html>
